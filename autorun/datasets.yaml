# DATASETS — 数据集目录（人写）
#
# 这是"我们一共要处理哪些数据集"的唯一清单，也是 policy.json 里 targets 的来源。
# 加一个数据集 = 在这里加一条 + 跑 `python build_policy.py --write`。不需要改任何代码。
#
# ── 字段说明 ──────────────────────────────────────────────────────
#   task        任务名（= policy.json targets 的键，全局唯一，稳定不变）
#   status      active（已就绪，可进判定） / preparing（管线就绪，基线待测） / planned（已列入，待核实）
#   dim         2D / 3D
#   modality    成像模态
#   classes     类别数（含背景）
#   metric      判定用的指标名（同 task 内唯一）
#   subset      在哪个子集上比（testB / cv5 / val ...）
#   convention  口径 id，必须来自下面 conventions 注册表（红线 R1）
#   eval_script 官方协议评估脚本文件名；进 policy.json 的 eval.allowlist（红线 R5）
#   l1          保底线数值（自家 nnU-Net v2 官方口径实测）；未核实填 null
#   l2          冲刺线数值（已发表 SOTA / 榜前 50%）；未核实填 null
#   l1_source   数字来源（红线 R2：无来源不得用于判定）
#   l2_source   同上
#   verified    该条的协议 + 基线数字是否已核实；false 时不得进 targets
#   note        备注
#
# ⚠ 红线 R2：l1 / l2 只有在 verified: true 且带 source 时才允许填写。
#   没有来源就先留 null —— 宁可空着，不许编。

meta:
  version: "1.3"
  updated: "2026-10-08"
  note: >
    首批 15 个数据集。前 3 个（GLaS / DRIVE / PUMA）是本项目已有数据、已就绪；
    其余 12 个是待启动的扩展位，协议与基线数字需 Step 0 逐一核实后才升级为 active。
    v1.3（2026-10-08）：PUMA 由 preparing 转 active —— 官方评估脚本 eval_puma_official.py
    就位并进 R5 allowlist；这也是"加一行即可扩展"的第一次实测（不改任何代码）。

# ── 口径注册表（红线 R1 的受控词表）────────────────────────────────
# 参与比较的数字必须同 metric + subset + convention；跨口径一律不可比。
# ⚠ 2026-10-08 裁定：对象级口径必须区分「提交形态」—— 同一批预测，
#   实例标签提交 vs 二值提交可差 ≈0.02（GLaS 实测）。故拆成两个 id。
conventions:
  official_object_level:
    desc: 官方对象级（实例标签提交形态）—— 预测以实例标签图提交（相邻腺体像素可粘连但标签独立），1:1 最大重叠对应 + 面积加权 + 数据集级池化
  official_object_level_binary:
    desc: 官方对象级（二值提交形态）—— 预测为二值前景图，按连通域重新标注成对象；仅用于口径校准记录，不作 GLaS 的判定口径
  pixel_level:
    desc: 像素级 —— 逐图像素 Dice，多折交叉验证后取均值
  official_micro_dice:
    desc: 官方 micro Dice —— 数据集级池化（把所有像素/体素汇总后算），多类别
  official_dice_hd95:
    desc: 官方 Dice + HD95 双指标 —— 体积重叠 + 边界距离
  official_instance_f1:
    desc: 官方实例级 F1 —— 先做实例对应再做 TP/FP/FN 统计

datasets:

  # ══ 已就绪（active）════════════════════════════════════════════
  - task: GLaS
    status: active
    dim: 2D
    modality: histology_H&E
    classes: 2
    metric: testB_objDice
    subset: testB
    convention: official_object_level
    eval_script: eval_glas_official.py
    l1: 0.8184
    l1_source: RESEARCH_LOG.md#nnunet-glas
    l2: 0.842
    l2_source: https://arxiv.org/abs/1910.10470
    verified: true
    note: >
      起点数据集；框架验证用。L2 = U-Node (Pinckaers & Litjens, 2019) testB ObjDice 0.842，
      来源 arXiv:1910.10470 Table 1（官方对象级口径）。
      选它的理由：**该路线有可复现的开源代码**（ROUTE_POOL R05），能当复现锚点。
      原 L2 = MILD-Net 0.836 于 2026-10-08 上移 —— MILD-Net 无官方代码，做不了锚点。
      【2026-10-08 口径裁定，policy v1.6】convention 采用**实例标签提交形态**
      （评估脚本 --pred_kind label）。依据：GLaS 官方提交本就是实例标签图；同一批 U-Node
      预测 label 0.8440 vs binary 0.8215，≈0.02 的差全部来自「是否做实例分离」。
      nnU-Net 的二值连通域即其实例形态，故 L1=0.8184 在两种形态下同值、不受影响；
      L2=0.842 是文献实例口径，二者可比（同 convention）。

  - task: DRIVE
    status: active
    dim: 2D
    modality: retinal_fundus
    classes: 2
    metric: cv_dice
    subset: cv5
    convention: pixel_level
    eval_script: null          # 目前用 nnU-Net 内置评估，官方协议脚本待补 → R5 会挡住
    l1: 0.7990
    l1_source: RESEARCH_LOG.md#nnunet-drive
    l2: null
    l2_source: null
    verified: true
    note: 榜前 50% 门槛需先确认榜单总条目数，故 L2 暂空（LLM 轨道目前 rank 86）

  - task: PUMA
