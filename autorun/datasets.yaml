    l1: 0.5548
    l1_source: RESEARCH_LOG.md#puma
    l2: null
    l2_source: null
    verified: true
    note: >
      基线已实测 0.5548（nnU-Net v2，官方 micro Dice，来源 RESEARCH_LOG §3.2）。
      【2026-10-08 转 active】官方评估脚本 eval_puma_official.py 就位（4/4 自检通过）并进
